name: Build (Linux arm64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter (clone SDK from GitHub)
        run: |
          git clone --depth 1 -b 3.41.9 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Bootstrap Flutter / Dart for arm64
        run: |
          flutter --version
          flutter config --no-analytics
          flutter precache --web

      - name: Build editor (Flutter web)
        working-directory: sl_editor
        run: |
          flutter pub get
          flutter build web --no-wasm-dry-run --base-href /editor/

      - name: Build server (Dart CLI)
        working-directory: sl_server
        run: |
          dart pub get
          dart build cli

      - name: Assemble bundle
        run: |
          mkdir -p sl_server/build/cli/linux_arm64/bundle/root/public
          cp -r sl_editor/build/web/. sl_server/build/cli/linux_arm64/bundle/root/public/

      - name: Upload bundle archive
        uses: actions/upload-artifact@v7
        with:
          name: sl-server-linux-arm64
          path: sl_server/build/cli/linux_arm64/bundle/
          if-no-files-found: error
