name: Build (Linux x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9

      - name: Build editor (Flutter web)
        working-directory: sl_editor
        run: |
          flutter pub get
          flutter build web --no-wasm-dry-run --base-href /editor/

      - name: Build server (Dart CLI)
        working-directory: sl_server
        run: |
          dart pub get
          dart build cli

      - name: Assemble bundle
        run: |
          mkdir -p sl_server/build/cli/linux_x64/bundle/root/public
          cp -r sl_editor/build/web/. sl_server/build/cli/linux_x64/bundle/root/public/

      - name: Upload bundle archive
        uses: actions/upload-artifact@v7
        with:
          name: sl-server-linux-x64
          path: sl_server/build/cli/linux_x64/bundle/
          if-no-files-found: error