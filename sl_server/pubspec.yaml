name: sl_server
description: A server app using the shelf package and Docker.
version: 1.0.0
repository: https://github.com/willhuff0/sl
publish_to: none

environment:
  sdk: ^3.10.8

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.2
  shelf_web_socket: ^3.0.0
  uuid: ^4.5.2
  web_socket_channel: ^3.0.3
  sl_shared:
    path: ../sl_shared
  path: ^1.9.1
  vector_math: ^2.2.0
  meta: ^1.18.1
  drift: ^2.32.0
  sqlite3: ^3.1.6

dev_dependencies:
  lints: ^6.0.0
  build_runner: ^2.12.2
  drift_dev: ^2.32.0
